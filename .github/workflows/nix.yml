name: Nix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — a cold OxCaml build is too expensive to waste.
concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast drift checks that gate the expensive build: committed generated files must match
  # what their sources produce.
  drift-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify the vendored Firebase shim matches its sources
        # firebase/vendor/firebase-shim.js is committed; rebuilding it from the pinned
        # package-lock.json must be a no-op, or someone changed the shim sources (or bumped
        # the SDK) without re-vendoring.
        run: |
          cd firebase/shim
          npm ci
          npm run build
          git diff --exit-code ../vendor/firebase-shim.js

      - name: Verify the vendored Temporal polyfill matches its sources
        # Same deal as the Firebase shim: temporal/vendor/temporal-shim.js is committed
        # (core's timezone loader needs it on browsers without native Temporal, i.e.
        # Safari); rebuilding from the pinned package-lock.json must be a no-op.
        run: |
          cd temporal/shim
          npm ci
          npm run build
          git diff --exit-code ../vendor/temporal-shim.js

  nix-build:
    needs: drift-checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.fu.io

      - name: Verify package-defs.lock matches flake.lock (materialized resolution not stale)
        # package-defs.json is the materialized opam resolution; package-defs.lock records
        # the opam repo input revs it was generated against. If flake.lock moved those revs
        # without a re-materialization (`nix run .#update-package-defs`), fail. This lives
        # here rather than in drift-checks because it is a flake app now and needs Nix; it
        # still runs before anything expensive is built.
        run: |
          nix run .#update-package-defs-lock
          git diff --exit-code package-defs.lock

      - name: Verify every git source in package-defs.json is pinned to a commit
        # A git source without an explicit sha1 cannot be fetched in pure evaluation mode.
        # --check names the offending package instead of leaving it to surface as an
        # evaluation error from inside the build below. It does not touch the file.
        run: nix run .#opam-nix-pin-git-refs -- --check package-defs.json

      - name: Check Nix formatting (nix fmt must be a no-op)
        run: |
          nix fmt
          git diff --exit-code

      - name: Build the flake (client bundle + avalon_core unit tests)
        # doCheck = true in the derivation runs `dune runtest test`, so this builds and tests.
        run: nix build --print-build-logs .#default

      - name: Stage the client bundle
        run: |
          mkdir -p dist
          cp -L result/* dist/

      - name: Upload the client bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avalon-bonsai-client
          path: dist/

      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  # Publishes the bundle to GitHub Pages at https://ocaml.avalon.onl (the custom domain
  # is set in the repo's Pages settings, not here; the API allows that origin via CORS —
  # see georgyo/nix-conf hosts/hydra/containers/avalon/default.nix).
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: nix-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
